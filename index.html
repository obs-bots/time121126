<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рокси и часы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Manrope:wght@500;600&display=swap">
<style>
/* Layout: one full-bleed scene. The illustration is the stage; a live clock face is fitted over the painted dial
   (and the small wall clock), and a quiet HUD sits in the dark lower-left corner. Warm honey light, brown-black shade. */
:root {
  --bg: #120e0b;
  --ink: #f4ead6;
  --muted: #b9a98c;
  --honey: #f2b75c;
  --amber: #d98a3a;
  --wood: #3a2616;
  --line: rgba(244, 234, 214, .22);
  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ax: 58%;
  --stage-w: max(100vw, calc(100svh * 16 / 9));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow-x: hidden; }
.hero { position: relative; height: 100svh; min-height: 420px; overflow: hidden; background: var(--bg); isolation: isolate; }

.stage {
  position: absolute; top: 0; left: var(--ax);
  width: var(--stage-w); aspect-ratio: 16 / 9;
  transform: translateX(calc(-1 * var(--ax)));
}
.zoom { position: absolute; inset: 0; transform-origin: 56% 28%; animation: drift 40s ease-in-out infinite alternate; }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.045); } }
.zoom img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.face { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; }
.face.big { left: 47.85%; top: 19.9%; width: 22.7%; }
.face.mini { left: 81.05%; top: 36.4%; width: 3.55%; }
.face svg { display: block; width: 100%; height: 100%; overflow: visible; }
.hand { transform-origin: 100px 100px; }
.ready .hand.s { transition: transform .32s cubic-bezier(.3, 1.9, .5, .75); }
.ready .hand.m, .ready .hand.h { transition: transform .5s linear; }
.hands { filter: drop-shadow(3px 4px 2px rgba(45, 28, 12, .38)); }
.mini .nums { display: none; }
.mini .hands { filter: drop-shadow(1px 1px 1px rgba(45, 28, 12, .4)); }

/* light, shade, grain over the whole scene so the live dials sit inside the painting */
.beam {
  position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
  background:
    linear-gradient(100deg, rgba(255, 214, 140, .55) 0%, rgba(255, 214, 140, .22) 30%, transparent 55%),
    radial-gradient(ellipse 60% 50% at 8% 28%, rgba(255, 236, 190, .6), transparent 70%);
  animation: breathe 9s ease-in-out infinite alternate;
}
@keyframes breathe { from { opacity: .7; } to { opacity: 1; } }
canvas.motes { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.grain {
  position: absolute; inset: 0; pointer-events: none; opacity: .09; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.shade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to top, rgba(18, 14, 11, .96) 0%, rgba(18, 14, 11, .72) 24%, rgba(18, 14, 11, 0) 52%),
    radial-gradient(ellipse 120% 90% at 55% 35%, transparent 55%, rgba(18, 14, 11, .55) 100%);
}

.hud { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; justify-content: space-between; padding-block: 24px 36px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.brand { font-family: var(--sans); font-weight: 600; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.brand b { color: var(--honey); font-weight: 600; }
.snd {
  pointer-events: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 10px;
  font: 600 12px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
  background: rgba(18, 14, 11, .5); border: 1px solid var(--line); border-radius: 999px; padding: 11px 16px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: border-color .2s, background .2s;
}
.snd:hover { border-color: var(--honey); }
.snd:focus-visible { outline: 2px solid var(--honey); outline-offset: 3px; }
.snd svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.snd .on { display: none; }
.snd[aria-pressed="true"] .on { display: block; }
.snd[aria-pressed="true"] .off { display: none; }
.snd[aria-pressed="true"] { border-color: var(--honey); color: var(--honey); }

.bottom { max-width: 760px; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--honey); margin: 0 0 6px; }
.time { display: flex; align-items: baseline; font-family: var(--serif); font-weight: 500; font-size: clamp(3.6rem, 12vw, 9rem); line-height: .95; letter-spacing: -.02em; text-shadow: 0 2px 30px rgba(0, 0, 0, .5); }
.time span { display: inline-block; width: .56em; text-align: center; }
.time .c { width: .3em; color: var(--honey); animation: blink 1s steps(1, end) infinite; }
@keyframes blink { 50% { opacity: .25; } }
.line { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: clamp(1.15rem, 2.6vw, 1.7rem); line-height: 1.3; color: var(--ink); margin: 14px 0 0; max-width: 30ch; text-wrap: balance; }
.meta { margin: 20px 0 0; display: flex; flex-wrap: wrap; gap: 10px 22px; font-size: 13px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
.meta span { display: inline-flex; align-items: center; gap: 8px; }
.meta span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }

.stats-sec { background: var(--bg); padding-block: 72px 88px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.stats-in { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px; }
.stats-in h2 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1.05; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.stats-in h2 em { color: var(--honey); font-weight: 700; }
.brk { margin: 14px 0 0; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.brk b { color: var(--ink); font-weight: 600; }
.nums4 { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.nums4 > div { padding: 26px 20px 22px 0; min-width: 0; }
.nums4 dt { font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); order: 2; margin-top: 10px; }
.nums4 dd { margin: 0; font-family: var(--serif); font-weight: 500; font-size: clamp(2.4rem, 6vw, 4rem); line-height: 1; color: var(--ink); overflow-wrap: anywhere; }
.nums4 > div { display: flex; flex-direction: column; }
.nums4 > div:first-child dd { color: var(--honey); }
.prog { display: flex; flex-direction: column; gap: 12px; }
.bar { height: 6px; border-radius: 3px; background: rgba(244, 234, 214, .12); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--amber), var(--honey)); border-radius: 3px; }
.bar-meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.bar-meta strong { color: var(--ink); font-weight: 600; }
.sq-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 18px; }
.sq-head h3 { font-family: var(--serif); font-weight: 500; font-size: 1.6rem; margin: 0; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.legend .a::before { background: var(--honey); }
.legend .b::before { background: var(--ink); }
.legend .c::before { background: rgba(244, 234, 214, .14); }
.sq { display: grid; grid-template-columns: repeat(auto-fill, minmax(16px, 1fr)); gap: 5px; }
.sq i { display: block; aspect-ratio: 1; border-radius: 3px; background: rgba(244, 234, 214, .1); }
.sq i.d { background: var(--honey); opacity: .88; }
.sq i.n { background: var(--ink); animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(242, 183, 92, .7); } 50% { box-shadow: 0 0 0 5px rgba(242, 183, 92, 0); } }
.mo { display: flex; justify-content: space-between; margin-top: 14px; font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .sq i.n { animation: none; } }

@media (max-aspect-ratio: 1 / 1) {
  :root { --ax: 62%; --stage-w: max(100vw, calc(100svh * 1.05)); }
  .stage { -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 98%); mask-image: linear-gradient(to bottom, #000 62%, transparent 98%); }
  .shade { background: linear-gradient(to top, rgba(18, 14, 11, .9) 0%, rgba(18, 14, 11, 0) 45%); }
  .bottom { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .zoom, .beam, .time .c { animation: none; }
  .ready .hand.s, .ready .hand.m, .ready .hand.h { transition: none; }
}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>

      <stop offset=".62" stop-color="#e8d9ad"/>
      <stop offset="1" stop-color="#c4ad7b"/>

    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6dc" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff6dc" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1708" stop-opacity=".28"/>
    </linearGradient>

</svg>

  var NS = "http://www.w3.org/2000/svg";
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function buildClock(host, mini) {
    var svg = el("svg", { viewBox: "0 0 200 200", "aria-hidden": "true" }, host);
    el("circle", { cx: 100, cy: 100, r: 101, fill: "#5a3a20" }, svg);
    el("circle", { cx: 100, cy: 100, r: 98.5, fill: "url(#dial)" }, svg);
    el("circle", { cx: 100, cy: 100, r: 98.5, fill: "none", stroke: "rgba(60,36,16,.55)", "stroke-width": 1.4 }, svg);
    for (var i = 0; i < 60; i++) {
      var five = i % 5 === 0, a = i * Math.PI / 30, s = Math.sin(a), c = -Math.cos(a);
      var r1 = five ? 84 : 90, r2 = 95;
      el("line", { x1: 100 + s * r1, y1: 100 + c * r1, x2: 100 + s * r2, y2: 100 + c * r2, stroke: "#3b2412", "stroke-width": five ? 2.2 : 0.9, "stroke-linecap": "round" }, svg);
    }
    var nums = el("g", { "class": "nums" }, svg);
    for (var n = 1; n <= 12; n++) {
      var an = n * Math.PI / 6;
      var t = el("text", { x: 100 + Math.sin(an) * 70, y: 100 - Math.cos(an) * 70, "text-anchor": "middle", "dominant-baseline": "central", fill: "#3b2412", "font-family": "Cormorant Garamond, Georgia, serif", "font-weight": 700, "font-size": 27, style: "font-variant-numeric: lining-nums" }, nums);
      t.textContent = n;
    }
    var hands = el("g", { "class": "hands" }, svg);
    var h = el("g", { "class": "hand h" }, hands);
    el("path", { d: "M100 116 L95.5 100 L100 50 L104.5 100 Z", fill: "#2b1a0c" }, h);
    el("circle", { cx: 100, cy: 60, r: 3.4, fill: "none", stroke: "#2b1a0c", "stroke-width": 1.8 }, h);
    var m = el("g", { "class": "hand m" }, hands);
    el("path", { d: "M100 120 L96.8 100 L100 22 L103.2 100 Z", fill: "#2b1a0c" }, m);
    var sc = el("g", { "class": "hand s" }, hands);
    el("line", { x1: 100, y1: 124, x2: 100, y2: 16, stroke: "#8e2f1c", "stroke-width": 1.4, "stroke-linecap": "round" }, sc);
    el("circle", { cx: 100, cy: 100, r: 4.6, fill: "#8e2f1c" }, sc);
    el("circle", { cx: 100, cy: 100, r: 2, fill: "#e8d9ad" }, svg);
    el("circle", { cx: 100, cy: 100, r: 98.5, fill: "url(#glare)" }, svg);
    return { h: h, m: m, s: sc };
  }

  var clocks = [];
  document.querySelectorAll("[data-clock]").forEach(function (host) {
    clocks.push(buildClock(host, host.getAttribute("data-clock") === "mini"));
  });

  var timeEl = document.getElementById("time");
  var digits = [];
  "HH:MM:SS".split("").forEach(function (ch) {
    var s = document.createElement("span");
    if (ch === ":") s.className = "c";
    s.textContent = ch === ":" ? ":" : "0";
    timeEl.appendChild(s);
    digits.push(s);
  });

  function plural(n, a, b, c) {
    var m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return a;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b;
    return c;
  }

  var END = new Date(2027, 10, 12, 0, 0, 0);
  var START = new Date(2026, 10, 12, 0, 0, 0);
  var TOTAL_DAYS = Math.round((END - START) / 864e5);
  var sqEl = document.getElementById("sq"), cells = [], lastDay = -1;
  for (var q = 0; q < TOTAL_DAYS; q++) {
    var cell = document.createElement("i");
    cell.title = new Date(2026, 10, 12 + q).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
    sqEl.appendChild(cell);
    cells.push(cell);
  }
  var moNames = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  var moEl = document.getElementById("mo");
  [10, 0, 2, 4, 6, 8, 10].forEach(function (mo, k) {
    var s = document.createElement("span");
    s.textContent = moNames[mo] + (k === 0 ? " 26" : k === 6 ? " 27" : "");
    moEl.appendChild(s);
  });
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  function stats(now) {
    var ms = Math.max(0, END - now);
    var D = Math.floor(ms / 864e5), H = Math.floor(ms % 864e5 / 36e5), M = Math.floor(ms % 36e5 / 6e4), S = Math.floor(ms % 6e4 / 1e3);
    var p = Math.min(1, Math.max(0, (now - START) / (END - START)));
    document.getElementById("st-d").textContent = fmt(D);
    document.getElementById("st-h").textContent = fmt(Math.floor(ms / 36e5));
    document.getElementById("st-m").textContent = fmt(Math.floor(ms / 6e4));
    document.getElementById("st-w").textContent = fmt(Math.floor(ms / (7 * 864e5)));
    document.getElementById("st-break").innerHTML = "Точно: <b>" + D + "</b> " + plural(D, "день", "дня", "дней") + " <b>" + H + "</b> " + plural(H, "час", "часа", "часов") + " <b>" + M + "</b> " + plural(M, "минута", "минуты", "минут") + " <b>" + S + "</b> " + plural(S, "секунда", "секунды", "секунд");
    document.getElementById("st-fill").style.width = (p * 100).toFixed(3) + "%";
    document.getElementById("st-pct").textContent = (p * 100).toFixed(2).replace(".", ",") + "%";
    document.getElementById("st-bar").setAttribute("aria-valuenow", Math.round(p * 100));
    var dayIdx = Math.floor((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - START) / 864e5);
    if (dayIdx !== lastDay) {
      lastDay = dayIdx;
      for (var i = 0; i < cells.length; i++) cells[i].className = i < dayIdx ? "d" : i === dayIdx ? "n" : "";
    }
  }
  var audioCtx = null, soundOn = false, lastSec = -1, flip = false;

  function tickSound() {
    if (!audioCtx) return;
    var t = audioCtx.currentTime, len = Math.floor(audioCtx.sampleRate * 0.05);
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);
    var src = audioCtx.createBufferSource(); src.buffer = buf;
    var f = audioCtx.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = flip ? 1300 : 1900; f.Q.value = 3.2;
    var g = audioCtx.createGain(); g.gain.value = 0.9;
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(t);
    flip = !flip;
  }

  function update(first) {
    var now = new Date();
    var secEpoch = Math.floor(now.getTime() / 1000);
    var local = secEpoch - now.getTimezoneOffset() * 60;
    var sA = local * 6, mA = local / 60 * 6, hA = local / 3600 * 30;
    clocks.forEach(function (c) {
      c.s.style.transform = "rotate(" + sA + "deg)";
      c.m.style.transform = "rotate(" + mA + "deg)";
      c.h.style.transform = "rotate(" + hA + "deg)";
    });
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    var str = p(now.getHours()) + ":" + p(now.getMinutes()) + ":" + p(now.getSeconds());
    for (var i = 0; i < 8; i++) if (digits[i].textContent !== str[i]) digits[i].textContent = str[i];
    if (secEpoch !== lastSec) {
      lastSec = secEpoch;
      if (soundOn && !first) tickSound();
      document.getElementById("date").textContent = now.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      var ms = END - now;
      var leftEl = document.getElementById("left");
      stats(now);
      if (ms > 0) {
        var d = Math.floor(ms / 864e5);
        leftEl.innerHTML = "До 12 ноября 2027: <b>" + d + "</b> " + plural(d, "день", "дня", "дней");
      } else {
        leftEl.textContent = "12 ноября 2027 наступило";
      }
    }
  }
  update(true);
  requestAnimationFrame(function () { requestAnimationFrame(function () { document.getElementById("hero").classList.add("ready"); }); });
  setInterval(function () { update(false); }, 250);

  var btn = document.getElementById("snd"), btnText = document.getElementById("sndText");
  btn.addEventListener("click", function () {
    soundOn = !soundOn;
    if (soundOn) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx && AC) audioCtx = new AC();
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        tickSound();
      } catch (e) {}
    }
    btn.setAttribute("aria-pressed", soundOn ? "true" : "false");
    btnText.textContent = soundOn ? "Тиканье включено" : "Включить тиканье";
  });

  // dust in the window light
  var cv = document.getElementById("motes"), ctx = cv.getContext("2d");
  var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var motes = [], W = 0, H = 0;
  for (var i = 0; i < 70; i++) {
    motes.push({ x: Math.random() * 0.5, y: Math.random(), r: 0.6 + Math.random() * 1.8, vx: 0.004 + Math.random() * 0.01, vy: -0.002 - Math.random() * 0.006, ph: Math.random() * 6.28, sp: 0.4 + Math.random() * 0.9 });
  }
  function size() {
    var r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  var last = 0;
  function draw(ts) {
    var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      if (!still) { m.x += m.vx * dt; m.y += m.vy * dt; m.ph += m.sp * dt; }
      if (m.x > 0.52) m.x = 0; if (m.y < -0.02) m.y = 1.02;
      var beam = Math.max(0, 1 - Math.abs(m.y * 0.9 - (0.55 - m.x * 0.9)) * 1.6);
      var a = (0.12 + 0.38 * (0.5 + 0.5 * Math.sin(m.ph))) * (0.35 + beam);
      ctx.beginPath();
      ctx.fillStyle = "rgba(255, 226, 160, " + a.toFixed(3) + ")";
      ctx.arc(m.x * W, m.y * H, m.r * (W / 1280) * 1.4, 0, 6.2832);
      ctx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  size();
  window.addEventListener("resize", size);
  requestAnimationFrame(draw);
})();
</script>

</body>
</html>
